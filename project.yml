name: Bayan
options:
  bundleIdPrefix: tools.rea
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  Bayan:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BayanApp.swift
      - path: Models
      - path: Services
      - path: Views
      - path: Intents
      - path: Assets.xcassets
      - path: Resources
    dependencies:
      - target: BayanWidgets
      - sdk: ShazamKit.framework
      - sdk: AVFoundation.framework
      - sdk: MediaPlayer.framework
      - sdk: AppIntents.framework
      - sdk: CoreLocation.framework
      - sdk: Accelerate.framework
      - sdk: Speech.framework
      - sdk: UserNotifications.framework
    settings:
      base:
        PRODUCT_NAME: Bayan
        PRODUCT_BUNDLE_IDENTIFIER: tools.rea.Bayan
        INFOPLIST_FILE: Config/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Bayan.entitlements
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "2"
        GENERATE_INFOPLIST_FILE: NO

  BayanWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Widgets
      - path: Intents/RecognizeQuranIntent.swift
      - path: Intents/ResumeQuranIntent.swift
      - path: Models/Surah.swift
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: AppIntents.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_NAME: BayanWidgets
        PRODUCT_BUNDLE_IDENTIFIER: tools.rea.Bayan.Widgets
        INFOPLIST_FILE: Config/Widgets-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/BayanWidgets.entitlements
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "2"
        GENERATE_INFOPLIST_FILE: NO
