name: Bayan
options:
  bundleIdPrefix: com.bayan
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  Bayan:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BayanApp.swift
      - path: Models
      - path: Services
      - path: Views
      - path: Intents
      - path: Assets.xcassets
      - path: Resources
    dependencies:
      - target: BayanWidgets
      - sdk: ShazamKit.framework
      - sdk: AVFoundation.framework
      - sdk: AVKit.framework
      - sdk: Network.framework
      - sdk: CoreImage.framework
      - sdk: AuthenticationServices.framework
      - sdk: MediaPlayer.framework
      - sdk: AppIntents.framework
      - sdk: CoreLocation.framework
      - sdk: Accelerate.framework
      - sdk: Speech.framework
      - sdk: UserNotifications.framework
      - sdk: StoreKit.framework
      - sdk: ActivityKit.framework
      - sdk: LocalAuthentication.framework
      - sdk: Security.framework
    settings:
      base:
        PRODUCT_NAME: Bayan
        PRODUCT_BUNDLE_IDENTIFIER: com.bayan.app
        INFOPLIST_FILE: Config/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Bayan.entitlements
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        MARKETING_VERSION: "1.1.81"
        CURRENT_PROJECT_VERSION: "81"
        GENERATE_INFOPLIST_FILE: NO

  BayanWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Widgets
      - path: Intents/RecognizeQuranIntent.swift
      - path: Intents/ResumeQuranIntent.swift
      - path: Models/Surah.swift
      - path: Models/PrayerActivityAttributes.swift
      - path: Models/QuranLyricsActivityAttributes.swift
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: AppIntents.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework
    settings:
      base:
        PRODUCT_NAME: BayanWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.bayan.app.Widgets
        INFOPLIST_FILE: Config/Widgets-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/BayanWidgets.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.1.81"
        CURRENT_PROJECT_VERSION: "81"
        GENERATE_INFOPLIST_FILE: NO
