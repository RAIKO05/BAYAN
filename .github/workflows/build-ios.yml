name: Build iOS App (Bayan)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build:
    name: Build iOS IPA on Cloud Mac
    runs-on: macos-15 # macOS 15 Sequoia with Xcode 16
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Select Xcode Version
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode*
          XCODE_LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          echo "Selecting newest Xcode: $XCODE_LATEST"
          sudo xcode-select -s "$XCODE_LATEST"
          xcodebuild -version

      - name: 🛠 Install XcodeGen
        run: brew install xcodegen

      - name: 📱 Generate Xcode Project
        run: |
          xcodegen generate
          # Ensure project format compatibility across Xcode 15 & 16
          sed -i '' 's/objectVersion = 77;/objectVersion = 56;/g' Bayan.xcodeproj/project.pbxproj || true
          sed -i '' 's/compatibilityVersion = "Xcode 16.0";/compatibilityVersion = "Xcode 15.0";/g' Bayan.xcodeproj/project.pbxproj || true

      - name: 🏗 Build iOS App
        run: |
          xcodebuild -project Bayan.xcodeproj \
            -scheme Bayan \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: 📦 Package into IPA
        run: |
          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/Bayan.app build/Payload/
          cd build
          zip -qr Bayan.ipa Payload
          echo "✅ Bayan.ipa successfully packaged!"

      - name: 🚀 Upload Bayan.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bayan-iOS-App
          path: build/Bayan.ipa
          retention-days: 14

      - name: 🏷️ Publish Direct IPA to GitHub Releases
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.1.${{ github.run_number }}"
          name: "Bayan iOS v1.1.${{ github.run_number }}"
          body: |
            ### 🕌 Bayan v1.1 Update Highlights
            - **Authentic Uthmanic Quran Calligraphy**: Bundled `Amiri Quran` / King Fahd Complex font with complete diacritics (waslah, madda, dagger alif, and sequential tanween).
            - **Floral End-of-Ayah Medallions**: Authentic ornate medallions (` ﴿١﴾`, ` ﴿٢﴾`) with Arabic-Indic numerals inline with verse text.
            - **Ornate Mushaf Surah Cartouches**: Traditional ornamental Islamic frames with metadata and calligraphic Bismillah banners.
            - **Prayer Times & Alerts**: 2/5 prayer circular progress ring, live next-prayer countdown, hero prayer card, and daily tracking cards.
            - **Three Mushaf Themes**: Paper parchment, Modern slate, and Dark obsidian with live visual theme switcher.

            ### 📱 Direct IPA Download
            Download `Bayan.ipa` directly below to install via TrollStore, AltStore, or Sideloadly.
          files: build/Bayan.ipa
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
