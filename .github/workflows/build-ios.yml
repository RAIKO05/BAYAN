name: Build iOS App (Bayan)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build:
    name: Build iOS IPA on Cloud Mac
    runs-on: macos-14 # Apple Silicon M1/M2 macOS Runner with Xcode

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app

      - name: 🛠 Install XcodeGen
        run: brew install xcodegen

      - name: 📱 Generate Xcode Project
        run: xcodegen generate

      - name: 🏗 Build and Archive App
        run: |
          xcodebuild -project Bayan.xcodeproj \
            -scheme Bayan \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Bayan.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: 📦 Package into IPA
        run: |
          mkdir -p build/Payload
          cp -R build/Bayan.xcarchive/Products/Applications/Bayan.app build/Payload/
          cd build
          zip -r Bayan.ipa Payload
          echo "✅ Bayan.ipa successfully packaged!"

      - name: 🚀 Upload Bayan.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bayan-iOS-App
          path: build/Bayan.ipa
          retention-days: 14
