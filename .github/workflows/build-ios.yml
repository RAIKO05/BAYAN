name: Build iOS App (Bayan)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build:
    name: Build iOS IPA on Cloud Mac
    runs-on: macos-15 # macOS 15 Sequoia with Xcode 16
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Select Xcode Version
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode*
          XCODE_LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          echo "Selecting newest Xcode: $XCODE_LATEST"
          sudo xcode-select -s "$XCODE_LATEST"
          xcodebuild -version

      - name: 🛠 Install XcodeGen
        run: brew install xcodegen

      - name: 📱 Generate Xcode Project
        run: |
          xcodegen generate
          # Ensure project format compatibility across Xcode 15 & 16
          sed -i '' 's/objectVersion = 77;/objectVersion = 56;/g' Bayan.xcodeproj/project.pbxproj || true
          sed -i '' 's/compatibilityVersion = "Xcode 16.0";/compatibilityVersion = "Xcode 15.0";/g' Bayan.xcodeproj/project.pbxproj || true

      - name: 🏗 Build iOS App
        run: |
          if ! xcodebuild -project Bayan.xcodeproj \
            -scheme Bayan \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" > xcodebuild.log 2>&1; then
              echo "=== BUILD FAILED: PRINTING ERRORS ==="
              grep -E "(error:|fatal error:)" xcodebuild.log | head -n 30 | while IFS= read -r line; do
                echo "::error::$line"
              done
              exit 1
          fi

      - name: 📦 Package into IPA
        run: |
          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/Bayan.app build/Payload/
          cd build
          zip -qr Bayan.ipa Payload
          echo "✅ Bayan.ipa successfully packaged!"

      - name: 🚀 Upload Bayan.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bayan-iOS-App
          path: build/Bayan.ipa
          retention-days: 14

      - name: 🏷️ Publish Direct IPA to GitHub Releases
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.1.${{ github.run_number }}"
          name: "Bayan iOS v1.1.${{ github.run_number }}"
          body: |
            ### 🕌 Bayan v1.1 Update Highlights
            - **iPad & iPadOS Universal Compatibility**: Full native iPad tablet layout with support for iPadOS Split View, Slide Over, and all 4 orientations (Portrait, Upside Down, Landscape Left/Right).
            - **Adaptive Multi-Column Grid System**: Responsive layout intelligently shifts from single-column on iPhone to balanced 2-3 column grid layouts on iPad for Surah catalog, verse search results, and Hisn al-Muslim Adhkar cards.
            - **Native Apple Silicon Mac Support**: Run Bayan on macOS Sonoma & Sequoia via Designed for iPad with desktop keyboard navigation, audio recitation, and large-display clarity.
            - **Optimized Wide-Display Proportions**: Thoughtfully constrained reading widths and centered floating controls (WhatsApp floating dock, Spotify player sheet, 3D Digital Tasbih) preventing awkward edge-to-edge stretching on 11" and 13" iPad Pro screens.
            - **Interactive 3D Digital Tasbih (المسبحة الإلكترونية)**: Physics-simulated 3D rosary bead loop with rotation gestures, realistic bead click haptics (UIImpactFeedbackGenerator), 8 authentic Sunnah dhikr presets (Subhanallah, Alhamdulillah, Allahu Akbar, Astaghfirullah, etc.), custom bead materials (Obsidian Gold, Imperial Emerald, Sandalwood, Opalescent Pearl), milestone vibration celebrations, and full-screen OLED Blind Counting Mode for night and mosque meditation.
            - **Khatmah Reading Planner & Streak Engine**: Per-prayer reading quota breakdown (e.g. 4 pages after each of the 5 daily prayers to finish in 30 days), interactive prayer checkmarks, dynamic estimated completion date, and reading streak flame counter.
            - **Recitation Speed with Natural Pitch Preservation**: Fine-tune recitation tempo across 0.75x, 1.0x, 1.25x, and 1.5x with .timeDomain pitch algorithm preserving the authentic voice tone of world-renowned Qura'a without distortion.
            - **Bedtime Sleep Timer with Gentle Auto-Fade**: Fall asleep peacefully listening to the Quran with configurable 15m, 30m, 45m, 60m, End of Current Ayah, or End of Current Surah timers featuring a gentle 2-second volume fade-out.
            - **Dual Audio Mode (Arabic Recitation + English Voiceover)**: Seamlessly listen to the Arabic verse recitation followed immediately by dignified English translation audio (AVSpeechSynthesizer) before advancing to the next Ayah.
            - **Ayah of the Day Widgets**: Daily inspirational Quran verses in Arabic and English across Small, Medium, Large Home Screen and Lock Screen Rectangular widgets, with 1-tap deep link to jump into the Mushaf.
            - **Quick Quran Identify Widgets**: 1-tap audio recognition launcher widget on Home Screen and Lock Screen (accessoryCircular and accessoryInline) to instantly identify any recitation.
            - **Spotify-Style Full-Screen Player with Synchronized Quran Lyrics**: Real-time synchronized verse scrolling, highlighted active Ayah, tap-to-recite jump navigation, full cover art flip, and smooth scrubber.
            - **WhatsApp Floating Capsule Navigation Bar**: Frosted glass floating capsule with sliding selection pill and badge indicators.
            - **Hisn al-Muslim (حصن المسلم - Fortress of the Muslim)**: Complete authentic daily Adhkar & Duas (Morning, Evening, Sleep, Waking, After Prayer, Quranic Duas, Protection) with interactive circular counter dial, haptics, and Hadith virtues.
            - **Offline Quran Audio Downloader**: Download full Surahs or Ayahs for 100% offline recitation without cellular or Wi-Fi data usage, complete with storage manager.
            - **Color-Coded Tajweed Rules Mushaf**: Authentic Tajweed coloring (Ghunnah, Qalqalah, Idgham, Ikhfa, Iqlab, Madd) with interactive Tajweed rules guide sheet.
            - **Live Activities & Dynamic Island**: Real-time next prayer countdown and city/Qibla status on iPhone Dynamic Island and Lock Screen.
            - **Quran Memorization (Hifz) Companion**: Interactive memorization tool with tap-to-reveal words, first-letter memory hints, blank testing, and mastery tracker.
            - **Expanded Reciters Catalog (36 World-Renowned Qura'a)**: Comprehensive catalog featuring Abdul Rahman Al-Sudais, Saud Al-Shuraim, Maher Al-Muaiqly, Yasser Al-Dosari, Saad Al-Ghamdi, Abu Bakr Ash-Shatri, Ali Jaber, Nasser Al-Qatami, Ahmed Al-Ajamy, Abdullah Awad Al-Juhany, Muhammad Ayyub, Ali Al-Hudhaify, Dr. Ayman Suwayd, Minshawi & Husary (Murattal, Mujawwad & Teacher), and Warsh masters (Omar Al-Kazabri, Yassin Al-Jazaery, Abdul Basit, Ibrahim Al-Dosari).
            - **Interactive In-Sheet Audio Preview**: Audition any reciter's soothing voice with instant streaming audio preview and live animated waveforms before selecting.
            - **Favorite Reciters Pinning**: Pin your most-loved reciters with one tap to keep them at the top of your list.
            - **New Official App Icon (Imperial Emerald Calligraphy)**: 3D sculpted solid gold Arabic calligraphy monogram of "بيان" (Bayan) with minaret finial on rich imperial Damascus emerald green.
            - **iCloud Sync & Cloud Backup**: Seamless automatic cross-device sync of Khatmah goals, reading position, Ayah bookmarks, daily prayer tracker history, and preferences across iPhone, iPad, and Mac via Apple CloudKit (`NSUbiquitousKeyValueStore`).
            - **Lock Screen & Home Screen Prayer Widgets**: Live next-prayer countdown and daily timeline widgets across Lock Screen (`accessoryRectangular`, `accessoryCircular`, `accessoryInline`) and Home Screen (`systemSmall`, `systemMedium`).
            - **Lock Screen Media Controls & Dynamic Island**: Background audio recitation with dynamic golden artwork, Surah title, Ayah number, reciter, scrubbing timeline, next/prev Ayah skipping, and play/pause from Lock Screen and Control Center.
            - **Full-Text Quran Verse Search (Ayah Search)**: Instant full-text search across all 6,236 Ayahs in Arabic (with/without tashkeel) and English translation with direct jump-to-verse navigation.
            - **Global Prayer Calculation Conventions & 15m Pre-Adhan Reminder**: Configurable calculation methods (Morocco Habous, Umm Al-Qura, MWL, Egyptian Authority, ISNA, Karachi), Asr juristic school (Standard vs Hanafi), and optional 15-minute advance prayer preparation alert.
            - **Unified Theme Engine**: Obsidian, Midnight Velvet, Emerald Sanctuary, Royal Indigo, Desert Dunes, and Rose Garden synchronized across Mushaf, Prayers Dashboard, and Qibla.
            - **Authentic Uthmanic Quran Calligraphy**: Bundled `Amiri Quran` / King Fahd Complex font with complete diacritics, ornate cartouche frames, and authentic floral end-of-ayah medallions.

            ### 📱 Direct IPA Download
            Download `Bayan.ipa` directly below to install via TrollStore, AltStore, or Sideloadly.
          files: build/Bayan.ipa
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
